[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "birdlife-hotspot-finder"
version = "0.1.0-dev"
description = "Find data gaps in eBird coverage for volunteer survey prioritization"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "BirdLife Tools Community" }]
keywords = ["ebird", "conservation", "citizen-science", "data-gaps", "birdwatching"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
]

[project.optional-dependencies]
postgres = [
    "psycopg[binary]>=3.1",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-httpx>=0.30",
    "jsonschema>=4.22",
    "fastavro>=1.9",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.urls]
Homepage = "https://github.com/birdlife-tools/volunteer-hotspot-finder"
Documentation = "https://github.com/birdlife-tools/volunteer-hotspot-finder#readme"
Repository = "https://github.com/birdlife-tools/volunteer-hotspot-finder"
Issues = "https://github.com/birdlife-tools/volunteer-hotspot-finder/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/birdlife_hotspot_finder"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "psycopg.*"
ignore_missing_imports = true
